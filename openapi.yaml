  "info": {
    "title": "StudentCouncil.Web",
    "version": "1.0",
    "description": "API студенческого совета: пользователи, мероприятия, бейджи, аутентификация и 2FA."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "tags": [
    {
      "name": "Account",
      "description": "Аутентификация, выход, текущий пользователь и двухфакторная аутентификация"
    },
    {
      "name": "Badge",
      "description": "Бейджи участников и файлы бейджей"
    },
    {
      "name": "Event",
      "description": "Мероприятия и фотографии мероприятий"
    },
    {
      "name": "User",
      "description": "Пользователи, аватары и сброс пароля"
    }
  ],
  "security": [
    {
      "cookieAuth": []
    }
  ],
  "paths": {
    "/api/account/login": {
      "post": {
        "tags": [
          "Account"
        ],
        "summary": "Вход в систему",
        "description": "Проверяет email и пароль. Если 2FA не настроена — возвращает 402 и данные для настройки. Если 2FA включена — возвращает 403 с требованием кода.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequestDTO"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Успешный вход",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponseDTO"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "402": {
            "description": "Требуется настройка 2FA",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TwoFactorSetupResponseDTO"
                }
              }
            }
          },
          "403": {
            "description": "Требуется код 2FA",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "requiresTwoFactorCode": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/account/logout": {
      "post": {
        "tags": [
          "Account"
        ],
        "summary": "Выход из системы",
        "security": [
          {
            "cookieAuth": []
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/OkMessage"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
