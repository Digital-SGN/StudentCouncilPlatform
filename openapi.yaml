openapi: 3.0.1
info:
  title: Student Council API
  description: API для управления студенческим советом СГН
  version: 2.0.0
servers:
  - url: https://localhost:7107
    description: Development server

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: .AspNetCore.Identity.Application

  schemas:
    LoginRequestDTO:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: admin@studsovet.ru
        password:
          type: string
          example: password123

    LoginResponseDTO:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string

    CurrentUserDTO:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        avatarPath:
          type: string
        isActive:
          type: boolean

    UserDTO:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        patronymic:
          type: string
        group:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        telegram:
          type: string
        clothingSize:
          type: string
        birthDate:
          type: string
          format: date-time
        joinedAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        avatarPath:
          type: string
        balance:
          type: integer
        experiencePoints:
          type: integer
        level:
          type: integer
        eventsAttended:
          type: integer
        eventsOrganized:
          type: integer
        tasksCompleted:
          type: integer
        role:
          type: string
          enum: [Admin, Leader, Member]

    UserListResponseDTO:
      type: object
      properties:
        count:
          type: integer
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserDTO'

    CreateUserDTO:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
        lastName:
          type: string
        patronymic:
          type: string
        email:
          type: string
        password:
          type: string
        group:
          type: string
        phoneNumber:
          type: string
        telegram:
          type: string
        clothingSize:
          type: string
        birthDate:
          type: string
          format: date-time
        role:
          type: string
          enum: [Admin, Leader, Member]

    UpdateUserDTO:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        patronymic:
          type: string
        group:
          type: string
        phoneNumber:
          type: string
        telegram:
          type: string
        clothingSize:
          type: string
        birthDate:
          type: string
          format: date-time
        role:
          type: string
          enum: [Admin, Leader, Member]
        isActive:
          type: boolean

    EventResponseDTO:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        eventDate:
          type: string
          format: date-time
        location:
          type: string
        registrationLink:
          type: string
        status:
          type: string
          enum: [Upcoming, Ongoing, Completed, Cancelled]
        responsibleUserId:
          type: integer
        createdAt:
          type: string
          format: date-time

    EventListResponseDTO:
      type: object
      properties:
        count:
          type: integer
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventResponseDTO'

    CreateEventDTO:
      type: object
      required:
        - title
        - eventDate
        - location
        - responsibleUserId
      properties:
        title:
          type: string
        description:
          type: string
        eventDate:
          type: string
          format: date-time
        location:
          type: string
        registrationLink:
          type: string
        responsibleUserId:
          type: integer

    UpdateEventDTO:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        eventDate:
          type: string
          format: date-time
        location:
          type: string
        registrationLink:
          type: string
        responsibleUserId:
          type: integer
        status:
          type: string
          enum: [Upcoming, Ongoing, Completed, Cancelled]

    BadgeResponseDTO:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        eventId:
          type: integer
        eventTitle:
          type: string
        role:
          type: string
        filePath:
          type: string
        createdAt:
          type: string
          format: date-time

    BadgeListResponseDTO:
      type: object
      properties:
        count:
          type: integer
        badges:
          type: array
          items:
            $ref: '#/components/schemas/BadgeResponseDTO'

    CreateBadgeDTO:
      type: object
      required:
        - userId
        - eventId
        - role
      properties:
        userId:
          type: integer
        eventId:
          type: integer
        role:
          type: string

    UpdateBadgeDTO:
      type: object
      properties:
        role:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

security:
  - cookieAuth: []

paths:
  # ACCOUNT 
  /api/account/login:
    post:
      summary: Вход в систему
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDTO'
        '400':
          description: Неверные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Аккаунт заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/account/logout:
    post:
      summary: Выход из системы
      responses:
        '200':
          description: Выход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Не авторизован

  /api/account/current:
    get:
      summary: Текущий пользователь
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserDTO'
        '401':
          description: Не авторизован

  # USERS
  /api/users:
    get:
      summary: Список пользователей
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponseDTO'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin/Leader)

    post:
      summary: Создать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDTO'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Ошибка валидации
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin)
        '409':
          description: Email уже существует

  /api/users/{id}:
    get:
      summary: Получить пользователя
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (чужой профиль)
        '404':
          description: Пользователь не найден

    put:
      summary: Обновить пользователя
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDTO'
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Недопустимая роль
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён
        '404':
          description: Пользователь не найден

    delete:
      summary: Удалить пользователя
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (удаление себя или последнего админа)
        '404':
          description: Пользователь не найден

  /api/users/{id}/avatar:
    post:
      summary: Загрузить аватар
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Файл не выбран или недопустимый формат
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён
        '404':
          description: Пользователь не найден

    delete:
      summary: Удалить аватар
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён
        '404':
          description: Пользователь не найден

  # EVENTS
  /api/events:
    get:
      summary: Список мероприятий
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponseDTO'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin/Leader)

    post:
      summary: Создать мероприятие
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventDTO'
      responses:
        '200':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Ответственный не найден
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin)

  /api/events/{id}:
    get:
      summary: Получить мероприятие
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDTO'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin/Leader)
        '404':
          description: Мероприятие не найдено

    put:
      summary: Обновить мероприятие
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventDTO'
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Ответственный не найден
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin)
        '404':
          description: Мероприятие не найдено

    delete:
      summary: Удалить мероприятие
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Удалено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin)
        '404':
          description: Мероприятие не найдено

  # BADGES 
  /api/users/{userId}/badges:
    get:
      summary: Получить бейджи пользователя
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeListResponseDTO'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён
        '404':
          description: Пользователь не найден

  /api/events/{eventId}/badges:
    get:
      summary: Получить бейджи мероприятия
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeListResponseDTO'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin/Leader)
        '404':
          description: Мероприятие не найдено

  /api/badges/{id}:
    get:
      summary: Получить бейдж по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeResponseDTO'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (чужой бейдж)
        '404':
          description: Бейдж не найден

    put:
      summary: Обновить бейдж
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBadgeDTO'
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin)
        '404':
          description: Бейдж не найден

    delete:
      summary: Удалить бейдж
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin)
        '404':
          description: Бейдж не найден

  /api/badges/{id}/file:
    get:
      summary: Скачать файл бейджа
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Файл PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (чужой бейдж)
        '404':
          description: Бейдж или файл не найден

    post:
      summary: Загрузить файл бейджа
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Неверный формат файла
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin)
        '404':
          description: Бейдж не найден

    delete:
      summary: Удалить файл бейджа
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Файл удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: У бейджа нет файла
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin)
        '404':
          description: Бейдж не найден

  /api/badges:
    post:
      summary: Создать бейдж
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - userId
                - eventId
                - role
              properties:
                userId:
                  type: integer
                eventId:
                  type: integer
                role:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Ошибка валидации или файла
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещён (требуется Admin)
        '404':
          description: Пользователь или мероприятие не найдены