name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: StudentCouncil.Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: StudentCouncil.Frontend
        run: npm ci

      - name: Build frontend
        working-directory: StudentCouncil.Frontend
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ~/StudentCouncilPlatform
            git pull --ff-only origin main
            docker compose up -d --build backend
            docker compose build frontend
            docker run --rm \
              -v /var/www/studsovetsgn:/dest \
              studentcouncilplatform-frontend \
              sh -c "cp -r /usr/share/nginx/html/. /dest"
            chown -R www-data:www-data /var/www/studsovetsgn
            systemctl reload nginx
            docker image prune -f
