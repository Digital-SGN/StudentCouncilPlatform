services:
  db:
    image: postgres:15
    container_name: studentcouncil_db
    environment:
      POSTGRES_DB: studentcouncil
      POSTGRES_USER: admin_studsovet
      POSTGRES_PASSWORD: Demonrux201
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_studsovet"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: StudentCouncil.Web/Dockerfile
    container_name: studentcouncil_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=studentcouncil;Username=admin_studsovet;Password=Demonrux201
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data: