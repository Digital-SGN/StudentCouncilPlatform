services:
  postgres:
    image: postgres:16
    container_name: studentcouncil_db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: studsovet
      POSTGRES_USER: studsovet_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: studentcouncil_backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=Europe/Moscow
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=studsovet;Username=studsovet_admin;Password=${DB_PASSWORD}
    depends_on:
      - postgres
    volumes:
      - backend_wwwroot:/app/wwwroot
      - backend_logs:/app/Logs
      - backend_dp_keys:/app/DataProtection-Keys
    restart: unless-stopped

  frontend:
    build: ./StudentCouncil.Frontend
    container_name: studentcouncil_frontend
    ports:
      - "8081:80"   
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_wwwroot:
  backend_logs: 
  backend_dp_keys:
